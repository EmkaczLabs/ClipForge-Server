services:
  clipforge-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/clipforge/clipforge-server:latest
    container_name: clipforge-server
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Bind to localhost by default when placed behind a reverse proxy.
      # Override CLIPFORGE_HOST_BIND in .env (e.g., 0.0.0.0:3000) if needed.
      - "${CLIPFORGE_HOST_BIND:-127.0.0.1:3000}:3000"
    environment:
      CLIPFORGE_BIND_ADDR: "0.0.0.0:3000"
      CLIPFORGE_DATABASE_PATH: "/data/clipforge-server.db"
      # Storage mode: "s3" (default, external RustFS/S3) or "local" (zero S3 creds)
      CLIPFORGE_STORAGE_BACKEND: "${CLIPFORGE_STORAGE_BACKEND:-s3}"
      CLIPFORGE_STORAGE_PATH: "${CLIPFORGE_STORAGE_PATH:-/data/clips}"
      # External RustFS / S3 settings (ignored when CLIPFORGE_STORAGE_BACKEND=local)
      S3_ENDPOINT: "${S3_ENDPOINT:-https://s3.emkacz.dev}"
      S3_BUCKET: "${S3_BUCKET:-clipforge}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      # Server limits & public URL
      CLIPFORGE_PUBLIC_BASE_URL: "${CLIPFORGE_PUBLIC_BASE_URL:-}"
      CLIPFORGE_MAX_UPLOAD_BYTES: "${CLIPFORGE_MAX_UPLOAD_BYTES:-524288000}"
      CLIPFORGE_CHUNK_SIZE_BYTES: "${CLIPFORGE_CHUNK_SIZE_BYTES:-8388608}"
      CLIPFORGE_REGISTRATION_ENABLED: "${CLIPFORGE_REGISTRATION_ENABLED:-true}"
      CLIPFORGE_SESSION_TTL_HOURS: "${CLIPFORGE_SESSION_TTL_HOURS:-720}"
      RUST_LOG: "${RUST_LOG:-clipforge_server=info,tower_http=info}"
    volumes:
      - clipforge_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (enforced in Swarm mode; documented baseline for Compose)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  clipforge_data:
    driver: local
