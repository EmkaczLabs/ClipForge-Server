[workspace]
resolver = "2"
members = [
    "crates/clipforge-api",
    "crates/clipforge-db",
    "crates/clipforge-auth",
    "crates/clipforge-storage",
    "crates/clipforge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EmkaczLabs/ClipForge-Server"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

clipforge-api = { path = "crates/clipforge-api" }
clipforge-db = { path = "crates/clipforge-db" }
clipforge-auth = { path = "crates/clipforge-auth" }
clipforge-storage = { path = "crates/clipforge-storage" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
